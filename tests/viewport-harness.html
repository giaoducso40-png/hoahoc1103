<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>MolQuest viewport harness</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:auto;background:#cbd5e1}
    #frame{display:block;border:0;transform-origin:top left;background:#fff}
  </style>
</head>
<body>
  <iframe id="frame" src="../index.html" title="MolQuest test viewport"></iframe>
  <script>
    const query=new URLSearchParams(location.search);
    const width=Math.max(320,Number(query.get('width'))||1366);
    const height=Math.max(568,Number(query.get('height'))||768);
    const frame=document.querySelector('#frame');
    frame.width=width;frame.height=height;
    const scale=Math.min(1,innerWidth/width,innerHeight/height);
    frame.style.transform=`scale(${scale})`;
    document.body.style.width=`${width*scale}px`;
    document.body.style.height=`${height*scale}px`;
  </script>
</body>
</html>
